<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Window 9 - Camera Auto Capture</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
@import url('https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap');

body {
  margin: 0;
  background: transparent;
  overflow: hidden;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'DungGeunMo', monospace;
  color: white;
}

.camera-wrapper {
  position: relative;
  display: inline-block;
}

#frame {
  position: relative;
  display: block;
  height: 90vh;
  z-index: 2;
  pointer-events: none;
}

#camera {
  position: absolute;
  top: 55%;
  left: 51%;
  transform: translate(-50%, -50%);
  object-fit: cover;
  width: 85%;
  height: 85%;
  z-index: 1;
}

#countdown {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 100px;
  color: white;
  text-shadow: 0 0 20px rgba(0,0,0,0.8);
  z-index: 3;
}

#ending-screen {
  position: fixed;
  inset: 0;
  background: #000;
  color: #fff;
  display: none;
  justify-content: center;
  align-items: center;
  font-family: 'Press Start 2P', monospace;
  font-size: 50px;
  letter-spacing: 2px;
  text-shadow:
    0 0 8px rgba(255, 255, 255, 0.8),
    0 0 15px rgba(255, 255, 255, 0.5);
  z-index: 999;
  animation: fadeIn 2s ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>
<div class="camera-wrapper">
  <video id="camera" autoplay playsinline></video>
  <img id="frame" src="../img/window9/111.png" alt="camera frame">
  <div id="countdown"></div>
</div>

<div id="ending-screen">X is You</div>

<script>
const video = document.getElementById('camera');
const frame = document.getElementById('frame');
const countdown = document.getElementById('countdown');
const endingScreen = document.getElementById('ending-screen');

// 🔹 사용자 이름 불러오기
const username = localStorage.getItem('username') || "You";

// 🔹 카메라 시작
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    video.srcObject = stream;
    video.onplaying = () => {
      console.log("🎥 카메라 준비 완료! 3초 후 카운트다운 시작");
      setTimeout(startCountdown, 3000);
    };
  })
  .catch(err => {
    alert('카메라 접근 권한이 필요합니다.');
    console.error(err);
  });

// 🔹 카운트다운
function startCountdown() {
  let count = 3;
  countdown.textContent = count;
  const timer = setInterval(() => {
    count--;
    if (count > 0) {
      countdown.textContent = count;
    } else {
      clearInterval(timer);
      countdown.textContent = '';
      takePhoto();
    }
  }, 1000);
}

// 🔹 사진 촬영 후 텍스트 추가 + 프린트 전송
function takePhoto() {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');

  // 1️⃣ 비디오 캡처
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // 2️⃣ 오버레이 프레임 그리기
  const overlay = new Image();
  overlay.src = frame.src;

  overlay.onload = () => {
    ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);

    // 3️⃣ 텍스트 추가 ("X is [이름]!")
    ctx.font = `${canvas.width * 0.05}px 'DungGeunMo'`;
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.fillText(`X is ${username}!`, canvas.width / 2, canvas.height * 0.9);

    // 4️⃣ 이미지 전송
    const imgData = canvas.toDataURL('image/png');
    printImage(imgData);

    // 5️⃣ 엔딩화면 전환
    showEnding();
  };
}

// 🔹 서버로 전송 (Node.js print server 필요)
function printImage(imgData) {
  fetch('http://localhost:3000/print', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ image: imgData })
  })
  .then(res => res.text())
  .then(txt => console.log("🖨️ 인쇄 요청 완료:", txt))
  .catch(err => console.error("⚠️ 인쇄 오류:", err));
}

// 🔹 엔딩 화면 표시
function showEnding() {
  endingScreen.textContent = `X is ${username}!`;
  endingScreen.style.display = 'flex';
  console.log("🎬 엔딩 화면 표시됨");

  if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());

  setTimeout(() => {
    console.log("📤 부모에게 복귀 메시지 전송: RETURN_TO_WINDOW1");
    window.parent.postMessage("RETURN_TO_WINDOW1", "*");
  }, 3000);
}
</script>
</body>
</html>
